[project]
name = "popst"
version = "2.0.0"
description = "Configuration-driven node flow and origin-destination forecasting"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
exclude = ["latex", "datasets", "results", "artifacts"]
