model:
  id: od/stgode
  params:
    tpd: 0  # infer from data.frequency: 96 for 15 min, 24 for hourly
    sigma: 0.1
    thres: 0.6
  name: STGODE_OD
training:
  optimizer:
    name: AdamW
    lr: 0.002
    weight_decay: 0
  clip_grad_norm: 0
  scheduler:
    name: StepLR
    step_size: 20
    gamma: 0.5
