model:
  id: od/gwnet
  params:
    adj_type: doubletransition
    adp_adj: 1
    init_dim: 32
    skip_dim: 128
    end_dim: 128
    dropout: 0.3
  name: GWNET_OD
training:
  optimizer:
    name: Adam
    lr: 0.001
    weight_decay: 0.0001
  scheduler:
    name: StepLR
    step_size: 10
    gamma: 0.95
  clip_grad_norm: 5
