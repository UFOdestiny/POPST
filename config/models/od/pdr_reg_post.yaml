model:
  id: od/pdr_reg_post
  params:
    context_dim: 64
    zone_embed_dim: 16
    pdr_num_spatial_layers: 2
    num_experts: 3
    head_hidden_dim: 128
    dropout: 0.0
  name: PDR_REG_POST
training:
  scheduler:
    name: StepLR
    step_size: 200
    gamma: 0.95
  optimizer:
    name: Adam
    lr: 0.0002
    weight_decay: 0.0
  clip_grad_norm: 5
calibration:
  options:
    zero_cqr_alpha: 0.1
    zero_cqr_gate_quantile: 0.95
    zero_cqr_grid_size: 33
    zero_cqr_min_group: 64
    zero_cqr_mse_weight: 1.0
    zero_cqr_aux_epochs: 4
    zero_cqr_aux_samples: 400000
    zero_cqr_period: 96
    zero_cqr_disable_online: false
    zero_cqr_zero_floor: 0.001
    zero_cqr_active_bins: 8
