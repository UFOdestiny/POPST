model:
  id: flow/dstagnn
  params:
    order: 3
    nb_block: 2
    nb_chev_filter: 16
    nb_time_filter: 16
    time_stride: 1
    d_model: 128
    d_k: 16
    n_head: 3
    cheb_mask_rank: 8
  name: DSTAGNN
training:
  optimizer:
    name: Adam
    lr: 0.0001
    weight_decay: 0
  clip_grad_norm: 0
  scheduler:
    name: none
